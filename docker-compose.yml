services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: blood_bank
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./backend/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: blood-bank-app
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/blood_bank
      JWT_SECRET: local_dev_secret_change_me
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: