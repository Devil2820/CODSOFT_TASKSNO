<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Blood Bank</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-danger fixed-top">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="bi bi-droplet-half brand-icon"></i> Blood Bank</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="donate.html">Donate</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Register Card -->
  <section class="login-card">
    <div class="card">
      <div class="login-header">
        <i class="bi bi-person-plus fs-1"></i>
        <h3 class="mb-0 mt-2">Create Account</h3>
        <p class="mb-0 small">Register as a donor</p>
      </div>
      <div class="card-body p-4">
        <div id="registerError" class="alert alert-danger d-none" role="alert"></div>
        <div id="registerSuccess" class="alert alert-success d-none" role="alert">Account created! Redirecting to login...</div>

        <form onsubmit="handleRegister(event)">
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" id="regFullName" class="form-control" required placeholder="Enter your full name">
          </div>
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" id="regUsername" class="form-control" required placeholder="Choose a username">
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" id="regPassword" class="form-control" required minlength="6" placeholder="At least 6 characters">
          </div>
          <div class="row g-2">
            <div class="col-md-6 mb-3">
              <label class="form-label">Email</label>
              <input type="email" id="regEmail" class="form-control" required placeholder="you@example.com">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Phone</label>
              <input type="tel" id="regPhone" class="form-control" placeholder="+91 98765 43210">
            </div>
          </div>
          <div class="row g-2">
            <div class="col-md-6 mb-3">
              <label class="form-label">Blood Type</label>
              <select id="regBloodType" class="form-select">
                <option value="">Select (optional)</option>
                <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
                <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">City</label>
              <input type="text" id="regCity" class="form-control" placeholder="e.g. Pune">
            </div>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-blood btn-lg">Create Account</button>
          </div>
        </form>

        <p class="text-center mt-3 mb-0">
          Already have an account? <a href="login.html" class="text-danger text-decoration-none">Login here</a>
        </p>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
