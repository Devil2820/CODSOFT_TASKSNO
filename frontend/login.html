<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Blood Bank</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-danger fixed-top">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="bi bi-droplet-half brand-icon"></i> Blood Bank</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="donate.html">Donate</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Login Card -->
  <section class="login-card">
    <div class="card">
      <div class="login-header">
        <i class="bi bi-shield-lock fs-1"></i>
        <h3 class="mb-0 mt-2">Login</h3>
        <p class="mb-0 small">Sign in as User or Admin</p>
      </div>
      <div class="card-body p-4">
        <div id="loginError" class="alert alert-danger d-none" role="alert"></div>

        <form onsubmit="handleLogin(event)">
          <!-- Role Selection -->
          <label class="form-label fw-semibold">Login As:</label>
          <div class="mb-3">
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="role" id="roleUser" value="user" checked>
              <label class="form-check-label" for="roleUser">User</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="role" id="roleAdmin" value="admin">
              <label class="form-check-label" for="roleAdmin">Admin</label>
            </div>
          </div>

          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" required placeholder="Enter username">
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" required placeholder="Enter password">
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-blood btn-lg">Login</button>
          </div>
        </form>

        <!-- Demo Credentials -->
        <div class="mt-4 p-3 rounded" style="background:#f8f9fa;">
          <p class="fw-semibold mb-2 text-danger">Demo Credentials</p>
          <p class="mb-1"><strong>User:</strong> username <code>user</code> / password <code>user123</code></p>
          <p class="mb-0"><strong>Admin:</strong> username <code>admin</code> / password <code>admin123</code></p>
        </div>

        <p class="text-center mt-3 mb-1">
          New donor? <a href="register.html" class="text-danger text-decoration-none">Create an account</a>
        </p>
        <p class="text-center mb-0">
          <a href="index.html" class="text-danger text-decoration-none">&larr; Back to Home</a>
        </p>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
